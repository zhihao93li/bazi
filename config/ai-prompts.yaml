    喜用神：{{favorableElements}} | 忌神：{{unfavorableElements}}

    【十神关系】
    {{tenGods}}

    【大运信息】
    {{daYunDetailed}}

    【当前流年】
    {{currentLiuNian}}

    【命理要素】
    - 胎元：{{taiYuan}}
    - 命宫：{{mingGong}}
    - 身宫：{{shenGong}}

    【神煞信息】
    {{shenSha}}

    请从以下方面详细分析此人的感情运势：
    1. 感情观和恋爱特点（根据日主和十神配置）
    2. 适合的伴侣类型（根据五行喜用分析）
    3. 感情中需要注意的问题
