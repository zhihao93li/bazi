    【当前流年】
    {{currentLiuNian}}

    【星宿信息】
    {{xingXiu}}

    请从以下方面分析此人的健康状况：
    1. 根据五行强弱分析易患的健康问题（五行对应脏腑：金-肺/大肠，木-肝/胆，水-肾/膀胱，火-心/小肠，土-脾/胃）
    2. 需要特别注意的身体部位
    3. 根据大运流年分析健康需要注意的时期
    4. 养生保健建议（根据五行喜用）
