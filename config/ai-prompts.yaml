# AI 配置文件 - 八字命理分析（重构版）
# 此文件定义了 AI 分析服务的 prompt 模板和模型参数
# 采用两轮 LLM 架构：初步解读 + 分主题解读

# ============================================
# AI 服务提供商配置
# ============================================
provider: aihubmix
model: gpt-4o
temperature: 0.7
maxTokens: 2000

# ============================================
# 提示词模板
# ============================================
prompts:
  # ------------------------------------------
  # 第一轮：初步解读（后台参考资料，不展示给用户）
  # 用户点击任意主题解读时触发，结果存储在 Subject 中
  # ------------------------------------------
  initial: |
    # TODO: 用户填写初步解读提示词
    # 此提示词用于生成八字的全面初步解读，作为后续分主题解读的参考基础
    # 
    # 可用模板变量：
    # {{yearPillar.*}}, {{monthPillar.*}}, {{dayPillar.*}}, {{hourPillar.*}} - 四柱信息
    # {{dayMaster}}, {{dayMasterElement}}, {{dayMasterStrength}}, {{dayMasterCharacteristics}} - 日主信息
    # {{fiveElements.*}} - 五行分布
    # {{favorableElements}}, {{unfavorableElements}} - 喜忌神
    # {{tenGods}} - 十神关系
    # {{daYun}}, {{daYunDetailed}} - 大运信息
    # {{currentLiuNian}} - 当前流年
    # {{shengXiao}}, {{taiYuan}}, {{mingGong}}, {{shenGong}}, {{xunKong}} - 命理要素
    # {{shenSha}} - 神煞信息
    # {{gender}} - 性别
    # {{lunarDateStr}} - 农历日期
    # {{directions}} - 吉神方位
    # {{jieQi}} - 节气信息
    # {{xingXiu}} - 星宿信息

  # ------------------------------------------
  # 第二轮：分主题解读
  # 用户解锁某个主题时触发，传入初步解读结果 + 八字数据
  # ------------------------------------------
  themes:
    # 生命底色（独立卡片）
    life_color: |
      # TODO: 用户填写生命底色提示词
      # 探索生命本质与核心特质
      #
      # 额外可用变量：
      # {{initialAnalysis}} - 初步解读结果

    # 亲密关系（专项分析 Tab 1）
    relationship: |
      # TODO: 用户填写亲密关系提示词
      # 解读情感模式与亲密关系运势
      #
      # 额外可用变量：
      # {{initialAnalysis}} - 初步解读结果

    # 事业财富（专项分析 Tab 2）
    career_wealth: |
      # TODO: 用户填写事业财富提示词
      # 分析事业发展与财富机遇
      #
      # 额外可用变量：
      # {{initialAnalysis}} - 初步解读结果

    # 身心健康（专项分析 Tab 3）
    health: |
      # TODO: 用户填写身心健康提示词
      # 关注身体健康与心理平衡
      #
      # 额外可用变量：
      # {{initialAnalysis}} - 初步解读结果

    # 人生课题（专项分析 Tab 4）
    life_lesson: |
      # TODO: 用户填写人生课题提示词
      # 洞察生命成长与人生使命
      #
      # 额外可用变量：
      # {{initialAnalysis}} - 初步解读结果

    # 流年解读（独立卡片）
    yearly_fortune: |
      # TODO: 用户填写流年解读提示词
      # 当年运势分析与趋吉避凶
      #
      # 额外可用变量：
      # {{initialAnalysis}} - 初步解读结果
      # {{currentYear}} - 当前年份（如 2026）

# ============================================
# 可用的模板变量参考
# ============================================
# 
# 【四柱信息】
# {{yearPillar.heavenlyStem}} - 年柱天干
# {{yearPillar.earthlyBranch}} - 年柱地支
# {{yearPillar.naYin}} - 年柱纳音
# {{yearPillar.hiddenStems}} - 年柱藏干
# （月柱、日柱、时柱同理）
#
# 【日主信息】
# {{dayMaster}} - 日主天干
# {{dayMasterElement}} - 日主五行
# {{dayMasterStrength}} - 身强弱
# {{dayMasterCharacteristics}} - 日主特征
#
# 【五行分布】
# {{fiveElements.metal}} - 金
# {{fiveElements.wood}} - 木
# {{fiveElements.water}} - 水
# {{fiveElements.fire}} - 火
# {{fiveElements.earth}} - 土
# {{fiveElements.strongest}} - 最强五行
# {{fiveElements.weakest}} - 最弱五行
#
# 【喜忌神】
# {{favorableElements}} - 喜用神
# {{unfavorableElements}} - 忌神
#
# 【十神关系】
# {{tenGods}} - 十神配置
#
# 【命理要素】
# {{shengXiao}} - 生肖
# {{taiYuan}} - 胎元
# {{mingGong}} - 命宫
# {{shenGong}} - 身宫
# {{xunKong}} - 旬空
#
# 【大运流年】
# {{daYun}} - 大运简要
# {{daYunDetailed}} - 大运详细
# {{currentLiuNian}} - 当前流年
#
# 【其他信息】
# {{gender}} - 性别（male/female）
# {{lunarDateStr}} - 农历日期字符串
# {{shenSha}} - 神煞信息
# {{directions}} - 吉神方位
# {{jieQi}} - 节气信息
# {{xingXiu}} - 星宿信息
#
# 【第二轮专用】
# {{initialAnalysis}} - 初步解读结果
# {{currentYear}} - 当前年份

# ============================================
# 旧版提示词（保留向后兼容，将逐步废弃）
# ============================================
legacy_prompts:
  personality: |
    你是一位资深的命理分析师，精通中国传统八字命理学。请根据以下八字信息分析此人的性格特点：

    【八字四柱】
    - 年柱：{{yearPillar.heavenlyStem}}{{yearPillar.earthlyBranch}}（纳音：{{yearPillar.naYin}}，藏干：{{yearPillar.hiddenStems}}）
    - 月柱：{{monthPillar.heavenlyStem}}{{monthPillar.earthlyBranch}}（纳音：{{monthPillar.naYin}}，藏干：{{monthPillar.hiddenStems}}）
    - 日柱：{{dayPillar.heavenlyStem}}{{dayPillar.earthlyBranch}}（纳音：{{dayPillar.naYin}}，藏干：{{dayPillar.hiddenStems}}）
    - 时柱：{{hourPillar.heavenlyStem}}{{hourPillar.earthlyBranch}}（纳音：{{hourPillar.naYin}}，藏干：{{hourPillar.hiddenStems}}）

    【日主信息】
    - 日主：{{dayMaster}}（{{dayMasterElement}}）
    - 身强弱：{{dayMasterStrength}}
    - 日主特征：{{dayMasterCharacteristics}}

    【五行分布】
    金：{{fiveElements.metal}} | 木：{{fiveElements.wood}} | 水：{{fiveElements.water}} | 火：{{fiveElements.fire}} | 土：{{fiveElements.earth}}
    最强五行：{{fiveElements.strongest}} | 最弱五行：{{fiveElements.weakest}}
    喜用神：{{favorableElements}} | 忌神：{{unfavorableElements}}

    【十神关系】
    {{tenGods}}

    【命理要素】
    - 生肖：{{shengXiao}}
    - 胎元：{{taiYuan}}
    - 命宫：{{mingGong}}
    - 身宫：{{shenGong}}
    - 旬空：{{xunKong}}

    【神煞信息】
    {{shenSha}}

    请从以下方面详细分析此人的性格特点：
    1. 核心性格特征（基于日主、五行强弱、十神配置）
    2. 性格优势与长处
    3. 需要注意和改进的方面
    4. 与他人相处的特点
    5. 根据喜用神给出性格调整建议

    请用专业但易懂的语言进行分析，避免过于晦涩的术语。

  career: |
    你是一位资深的命理分析师，精通中国传统八字命理学。请根据以下八字信息分析此人的事业运势：

    【八字四柱】
    - 年柱：{{yearPillar.heavenlyStem}}{{yearPillar.earthlyBranch}}（纳音：{{yearPillar.naYin}}）
    - 月柱：{{monthPillar.heavenlyStem}}{{monthPillar.earthlyBranch}}（纳音：{{monthPillar.naYin}}）
    - 日柱：{{dayPillar.heavenlyStem}}{{dayPillar.earthlyBranch}}（纳音：{{dayPillar.naYin}}）
    - 时柱：{{hourPillar.heavenlyStem}}{{hourPillar.earthlyBranch}}（纳音：{{hourPillar.naYin}}）

    【日主信息】
    - 日主：{{dayMaster}}（{{dayMasterElement}}）
    - 身强弱：{{dayMasterStrength}}

    【五行分布】
    金：{{fiveElements.metal}} | 木：{{fiveElements.wood}} | 水：{{fiveElements.water}} | 火：{{fiveElements.fire}} | 土：{{fiveElements.earth}}
    喜用神：{{favorableElements}} | 忌神：{{unfavorableElements}}

    【十神关系】
    {{tenGods}}

    【大运信息】
    {{daYunDetailed}}

    【当前流年】
    {{currentLiuNian}}

    【神煞信息】
    {{shenSha}}

    请从以下方面详细分析此人的事业运势：
    1. 适合的职业方向和行业（根据五行喜用）
    2. 事业发展的优势和机遇
    3. 事业上需要注意的挑战
    4. 根据大运流年分析事业发展的关键时期
    5. 提升事业运的建议

    请用专业但易懂的语言进行分析。

  wealth: |
    你是一位资深的命理分析师，精通中国传统八字命理学。请根据以下八字信息分析此人的财运：

    【八字四柱】
    - 年柱：{{yearPillar.heavenlyStem}}{{yearPillar.earthlyBranch}}（纳音：{{yearPillar.naYin}}）
